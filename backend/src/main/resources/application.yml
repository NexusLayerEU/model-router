spring:
  application:
    name: ModelRouter

  datasource:
    url: jdbc:h2:file:./data/router-config;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.modelrouter: INFO
    org.springframework.web: WARN

watchgrid:
  url: ${WATCHGRID_URL:http://192.168.68.111:8085}
  sdk-key: ${WATCHGRID_SDK_KEY:}
